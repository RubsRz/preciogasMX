[build]
  # Los precios se regeneran en cada deploy, así el sitio siempre publica datos frescos
  command = "npm run data && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/data/*"
  [headers.values]
    # Siempre revisa si hay datos nuevos (si no cambiaron, Netlify responde 304 sin reenviar el archivo)
    Cache-Control = "public, max-age=0, must-revalidate"
